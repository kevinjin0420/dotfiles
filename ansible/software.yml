- hosts: localhost
  connection: local
  become: false
  gather_facts: true
  vars:
    dotfiles_dir: "{{ playbook_dir | dirname }}"
    user_home: "{{ lookup('env', 'HOME') }}"

  tasks:
    - name: Install software
      include_tasks: "tasks/software/{{ ansible_facts['os_family'] }}.yml"

    - name: Check installed Zed version
      command: zed --version
      register: _zed_installed
      changed_when: false
      failed_when: false
      when: ansible_facts['os_family'] != "Darwin"

    - name: Install or update Zed via official installer
      shell: curl -f https://zed.dev/install.sh | sh
      when:
        - ansible_facts['os_family'] != "Darwin"
        - _zed_installed.rc != 0
      changed_when: true

    - name: Ensure flatpak is installed
      package:
        name: flatpak
        state: present
      become: true
      when: ansible_facts['os_family'] != "Darwin"

    - name: Add Flathub remote
      community.general.flatpak_remote:
        name: flathub
        state: present
        flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
      become: true
      when: ansible_facts['os_family'] != "Darwin"

    - name: Install WeChat via Flatpak
      community.general.flatpak:
        name: com.tencent.WeChat
        state: present
      when: ansible_facts['os_family'] != "Darwin"

