- hosts: localhost
  connection: local
  vars:
    dotfiles_dir: "{{ playbook_dir | dirname }}"
    user_home: "{{ lookup('env', 'HOME') }}"

  tasks:
    - name: Ensure ~/.claude exists
      file:
        path: "{{ user_home }}/.claude"
        state: directory
        mode: '0755'

    - name: Symlink claude config files
      file:
        src: "{{ item }}"
        dest: "{{ user_home }}/.claude/{{ item | basename }}"
        state: link
        force: yes
      with_fileglob:
        - "{{ dotfiles_dir }}/claude/*"

    - name: Ensure ~/.cursor/rules exists
      file:
        path: "{{ user_home }}/.cursor/rules"
        state: directory
        mode: '0755'

    - name: Symlink universal.mdc
      file:
        src: "{{ dotfiles_dir }}/cursor/rules/universal.mdc"
        dest: "{{ user_home }}/.cursor/rules/universal.mdc"
        state: link
        force: yes
