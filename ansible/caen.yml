- hosts: localhost
  connection: local
  vars:
    dotfiles_dir: "{{ playbook_dir | dirname }}"
    user_home: "{{ lookup('env', 'HOME') }}"
    local_prefix: "{{ user_home }}/.local"
    zsh_custom: "{{ user_home }}/.oh-my-zsh/custom"
    neovim_release: stable
    neovim_dir: nvim-linux-x86_64

  tasks:
    - name: Assert required system tools are present
      command: "which {{ item }}"
      changed_when: false
      loop: [zsh, git, curl, tar]

    - name: Create local directories
      file:
        path: "{{ item }}"
        state: directory
      loop:
        - "{{ local_prefix }}/bin"
        - "{{ local_prefix }}/opt"
        - "{{ user_home }}/.config/tmux"

    - name: Download and unpack Neovim into ~/.local/opt
      unarchive:
        src: "https://github.com/neovim/neovim/releases/download/{{ neovim_release }}/{{ neovim_dir }}.tar.gz"
        dest: "{{ local_prefix }}/opt"
        remote_src: true
        creates: "{{ local_prefix }}/opt/{{ neovim_dir }}/bin/nvim"

    - name: Put nvim on PATH
      file:
        src: "{{ local_prefix }}/opt/{{ neovim_dir }}/bin/nvim"
        dest: "{{ local_prefix }}/bin/nvim"
        state: link
        force: true

    - name: Clone fzf
      git:
        repo: https://github.com/junegunn/fzf
        dest: "{{ user_home }}/.fzf"
        depth: 1
        update: false

    - name: Fetch the fzf binary
      command: "{{ user_home }}/.fzf/install --bin"
      args:
        creates: "{{ user_home }}/.fzf/bin/fzf"

    - name: Put fzf on PATH
      file:
        src: "{{ user_home }}/.fzf/bin/fzf"
        dest: "{{ local_prefix }}/bin/fzf"
        state: link
        force: true

    - name: Check if Oh-My-Zsh is installed
      stat:
        path: "{{ user_home }}/.oh-my-zsh"
      register: omz_dir

    - name: Install Oh-My-Zsh
      git:
        repo: https://github.com/ohmyzsh/ohmyzsh.git
        dest: "{{ user_home }}/.oh-my-zsh"
        depth: 1
        update: false
      when: not omz_dir.stat.exists

    - name: Install ZSH plugins and theme
      git:
        repo: "{{ item.repo }}"
        dest: "{{ zsh_custom }}/{{ item.type }}/{{ item.name }}"
        depth: 1
        update: false
      loop:
        - { name: zsh-autosuggestions,    type: plugins, repo: 'https://github.com/zsh-users/zsh-autosuggestions' }
        - { name: zsh-syntax-highlighting, type: plugins, repo: 'https://github.com/zsh-users/zsh-syntax-highlighting' }
        - { name: powerlevel10k,           type: themes,  repo: 'https://github.com/romkatv/powerlevel10k' }

    - name: Stat dotfiles that will be replaced by symlinks
      stat:
        path: "{{ user_home }}/{{ item }}"
      loop: [.bash_profile, .bashrc, .zshrc, .p10k.zsh, .gitconfig, always-forget.md]
      register: dotfile_stats

    - name: Back up pre-existing real dotfiles
      command: 'mv "{{ item.stat.path }}" "{{ item.stat.path }}.bak.{{ ansible_date_time.epoch }}"'
      loop: "{{ dotfile_stats.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.exists and not item.stat.islnk

    - name: Stat existing Neovim config
      stat:
        path: "{{ user_home }}/.config/nvim"
      register: nvim_cfg

    - name: Back up a real (non-symlink) Neovim config
      command: 'mv "{{ user_home }}/.config/nvim" "{{ user_home }}/.config/nvim.bak.{{ ansible_date_time.epoch }}"'
      when: nvim_cfg.stat.exists and nvim_cfg.stat.isdir and not nvim_cfg.stat.islnk

    - name: Create symlinks for dotfiles
      file:
        src: "{{ dotfiles_dir }}/{{ item.src }}"
        dest: "{{ user_home }}/{{ item.dest }}"
        state: link
        force: true
      loop:
        - { src: 'dots/zshrc',            dest: '.zshrc' }
        - { src: 'dots/p10k.zsh',         dest: '.p10k.zsh' }
        - { src: 'dots/gitconfig',        dest: '.gitconfig' }
        - { src: 'dots/always_forget.md', dest: 'always-forget.md' }
        - { src: 'dots/bash_profile',     dest: '.bash_profile' }
        - { src: 'dots/bash_profile',     dest: '.bashrc' }
        - { src: 'config/tmux/tmux.conf', dest: '.config/tmux/tmux.conf' }
        - { src: 'config/nvim',           dest: '.config/nvim' }

    - name: Reminders
      debug:
        msg:
          - "nvim {{ neovim_release }} installed to ~/.local/opt/{{ neovim_dir }}; ~/.local/bin is added to PATH by zshrc."
          - "Login shell stays bash; ~/.bash_profile execs zsh on interactive sessions."
          - "Run nvim once to let LazyVim sync plugins. Watch AFS quota: fs listquota ~"
          - "eecs482 setup is separate: ./ansible.sh eecs482.yml"
