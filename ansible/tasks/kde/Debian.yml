- name: klassy must be installed manually on Debian/Ubuntu
  fail:
    msg: >-
      klassy has no Debian/Ubuntu package. Build it from source following
      https://github.com/paulmcauley/klassy/blob/master/INSTALL.md (or fill in
      the scaffold in tasks/kde/Debian.yml), then re-run this playbook.
